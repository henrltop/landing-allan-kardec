{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Notícias{% endblock %} · Professor Allan Kardec 20020</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --azul:#070FB5; --verde:#51BC24; --amarelo:#F9C023; --branco:#FFFFFF; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Poppins', sans-serif; font-size:16px; line-height:1.65;
    color:var(--azul); background:var(--branco); overflow-x:clip;
  }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:3px solid var(--amarelo); outline-offset:2px;
  }
  .wrap{ width:min(1080px, 92vw); margin:0 auto; }
  header{
    position:sticky; top:0; z-index:60;
    background:var(--azul); border-bottom:1px solid var(--branco);
  }
  .nav-bar{ display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:72px; }
  .logo-link img{ height:50px; width:auto; }
  .nav-links{ display:flex; gap:26px; align-items:center; flex-wrap:wrap; }
  .nav-links a{ color:var(--branco); font-size:13px; font-weight:600; white-space:nowrap; transition:color .2s; }
  .nav-links a:hover{ color:var(--verde); }
  main{ min-height:60vh; }
  .banda{
    background:var(--azul); color:var(--branco);
    padding:clamp(40px, 6vw, 72px) 0;
  }
  .banda a{ color:var(--branco); }
  .conteudo{ padding:clamp(40px, 6vw, 72px) 0 clamp(56px, 7vw, 88px); }
  .kicker{
    font-size:14px; font-weight:600; letter-spacing:.26em;
    text-transform:uppercase; color:var(--verde);
  }
  h1{ font-size:clamp(28px, 4vw, 46px); font-weight:800; letter-spacing:-.02em; line-height:1.1; margin-top:16px; }
  .apoio{ margin-top:14px; max-width:60ch; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:50px; padding:0 28px; border-radius:2px; border:0; cursor:pointer;
    font-family:inherit; font-weight:600; font-size:15px;
    background:var(--azul); color:var(--branco); transition:background-color .2s;
  }
  .btn:hover{ background:var(--verde); }
  footer{ background:var(--azul); color:var(--branco); border-top:1px solid var(--branco); }
  .foot{ display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:26px 0; font-size:13px; }
  footer a{ color:var(--verde); font-weight:600; }
  .faixa{ display:grid; grid-template-columns:40fr 25fr 20fr 15fr; height:8px; }
  .faixa span:nth-child(1){ background:var(--azul); border-top:1px solid var(--branco); }
  .faixa span:nth-child(2){ background:var(--verde); }
  .faixa span:nth-child(3){ background:var(--amarelo); }
  .faixa span:nth-child(4){ background:var(--branco); }
  {% block css %}{% endblock %}
</style>
</head>
<body>
<header>
  <div class="wrap nav-bar">
    <a href="/" class="logo-link" aria-label="Página inicial">
      <img src="{% static 'logo-allan-kardec.png' %}" alt="Professor Allan Kardec · Deputado Estadual">
    </a>
    <nav class="nav-links">
      <a href="/">Início</a>
      <a href="{% url 'imprensa:noticias' %}">Notícias</a>
      <a href="{% url 'imprensa:enviar' %}">Sala de imprensa</a>
    </nav>
  </div>
</header>
<main>
  <div class="banda"><div class="wrap">{% block cabecalho %}{% endblock %}</div></div>
  <div class="wrap conteudo">{% block conteudo %}{% endblock %}</div>
</main>
<footer>
  <div class="wrap foot">
    <span>© 2026 Professor Allan Kardec · Podemos (20) · nº 20020</span>
    <a href="/">professorallankardec.com.br</a>
  </div>
  <div class="faixa" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
</footer>
</body>
</html>
