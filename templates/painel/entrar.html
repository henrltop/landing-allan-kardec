{% extends "painel/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <div class="bloco" style="max-width:420px; margin:6vh auto 0; padding:34px 32px">
    <h1>Entrar no painel</h1>
    <p class="sub" style="margin-bottom:26px">Acesso restrito à equipe de comunicação.</p>
    {% if form.errors %}<p class="erros" style="margin-bottom:14px">Usuário ou senha incorretos.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="campo">
        <label for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username">
      </div>
      <div class="campo">
        <label for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn" type="submit" style="width:100%">Entrar</button>
    </form>
  </div>
{% endblock %}
